# The stacks Galvanize Everything builds with: what the builder is told for each, and the phrases that
# ask for one by name. Placeholders in `steps`: {editor} (the game engine's editor), {player} and
# {ext} (Unity's player target and file extension on this computer). A stack without `steps` gets
# the generic instruction. Add a stack here; kinds name their default stack by `name`.
# `asked_by` phrases are matched on the request's lower-case words with punctuation turned into
# spaces and padded with spaces ("Next.js," reads " next js "), first stack in this order wins.
#
# `uses` lists package.json dependencies that show a build was made with the stack, so a build
# left to the builder ("Builder's choice") is recorded under the stack it really used. They, and
# Cargo.toml dependencies, also show what a person's own project is built with; `needs` lists what
# must be there too before it counts (Vite alone could be Vue or Svelte).
#
# `found_by` lists files, relative to a folder, that show a person's own project is built with
# the stack (`*.uproject` matches by its ending). An engine's file says most, then `uses`, then
# the others in this order, so "Builder's choice" takes any project whose dependencies name no
# stack here: the builder keeps to what's there.
#
# `site` marks a stack whose build is a website, so a project built with it and with nothing to
# recreate is one, whatever its request says.
#
# A `[[library]]` is a component or styling library asked for on top of a stack ("shadcn",
# "tailwind"): its `steps` are added to the stack's for the `stacks` it works with.
#
# A `[[toolchain]]` says how a project builds and tests itself, by the file that names the tool
# (the first in this order wins), so a person's own project can be checked in any language.
# `build` and `test` are a program and its arguments, run in the project's folder, after `configure`
# when it has one (CMake's configure step); `no_tests` is
# what its output says when no tests ran, which isn't a failure (with `test_script`, the
# package.json script that is its tests, whole scripts that are only placeholders: whether there
# are any is read from the file, as a script that runs others can print the same);
# `local_programs` are the
# project's own copies of the program, used first when one's there (`.bat`, `.cmd` and `.exe`
# ones on Windows, the others elsewhere); `windows_program` is its name on Windows, where it
# differs.

[[stack]]
name = "Builder's choice"
found_by = ["package.json", "Cargo.toml", "go.mod", "pom.xml", "build.gradle", "build.gradle.kts", "*.sln", "*.csproj", "Gemfile", "composer.json", "CMakeLists.txt", "Makefile"]
steps = "Use what their request names; otherwise choose the stack yourself: the one that best fits the request and the original. If the request names none and the capture shows what the original is built with (the script and stylesheet addresses in capture.json and page.html, for example /_next/ for Next.js or /_nuxt/ for Nuxt), use the same. For a website, create the project in app/ with a \"build\" script in package.json, then run `npm install` and `npm run build` from app/ until it succeeds: the output must be static files in app/dist, app/out or app/build (index.html at its top and each other page at its own path) that work when served as static files."

[[stack]]
name = "Electron"
asked_by = [" electron "]
uses = ["electron"]
steps = "Use Electron, with TypeScript or JavaScript (a bundler such as Vite is fine). Create the project in app/: package.json with electron as a devDependency, \"main\" set to the main-process file and a \"build\" script that compiles or bundles everything and exits without opening a window (for plain JavaScript, `node --check` on the main file is enough). Keep contextIsolation on and nodeIntegration off, and give the page what it needs through a preload script and IPC. For --screenshot, set backgroundThrottling to false, wait for the page to finish loading and about two seconds rather than counting requestAnimationFrame frames (a window that opens behind others may get none), then save win.webContents.capturePage(). Galvanize Everything starts the app with the Electron that `npm install` puts in node_modules, with app/ as its argument, so run `npm install` and `npm run build` from app/ until both succeed."

[[stack]]
name = "Next.js + TypeScript"
site = true
asked_by = [" nextjs ", " next js ", " use next ", " using next ", " in next "]
uses = ["next"]
steps = "Use Next.js (App Router) + React + TypeScript, exported as a static site. Create the project files directly in app/: package.json with next, react and react-dom and the script \"build\": \"next build\"; next.config.mjs with output: 'export', trailingSlash: true and images: { unoptimized: true }; tsconfig.json; src/app/layout.tsx and src/app/page.tsx, with one folder per other page under src/app/. Load the original's fonts with next/font. Use nothing a static export can't serve (API routes, server actions, middleware, dynamic routes without generateStaticParams). Then run `npm install` and `npm run build` from app/ until it succeeds; the output must be app/out and must work when served as static files."

[[stack]]
name = "Python"
asked_by = [" in python", " with python"]
found_by = ["pyproject.toml", "requirements.txt", "setup.py"]

[[stack]]
name = "React + TypeScript (Vite)"
site = true
asked_by = [" in typescript", " in react", " with react", " in javascript", " vite "]
uses = ["vite"]
needs = ["react"]
steps = "Use Vite + React + TypeScript. Create the project files directly in app/ (package.json with scripts \"build\": \"tsc -b && vite build\" or \"vite build\", vite.config.ts with base './', index.html, src/). Then run `npm install` and `npm run build` from app/ until it succeeds; the output must be app/dist and must work when served as static files."

[[stack]]
name = "Plain HTML and CSS"
site = true
asked_by = [" html and css ", " plain html ", " no frameworks ", " no javascript ", " no build step ", " static html "]
found_by = ["index.html"]
steps = "Use plain HTML, CSS and a little JavaScript only if the page needs it: no framework, no bundler, no build step. Create the project directly in app/: index.html at the top, one .css file (and .js only if needed) beside it, with each other page at its own path (about.html, contact.html). Link the stylesheet with a relative path. Then check that the pages open and look right when served as static files; there is nothing to build."

# The C++ stacks share one set of rules, repeated in each so every stack's steps stand alone:
# modern, memory-safe C++ and a CMake project whose build folder is app/target/ with the program in
# app/target/bin/, where the build check, Play and pins look for it. "in C++" in a request reads
# " cpp " (see `words`); the kind picks which C++ stack it means.

[[stack]]
name = "C++ (console)"
steps = "Use modern, memory-safe C++20 for a console program. Create a CMake project in app/ itself (app/CMakeLists.txt and app/src/main.cpp, not a folder inside app/), read its arguments into std::vector<std::string_view> (or a small argument parser fetched with FetchContent if it has many options), print to standard output and standard error the way the original does with std::print or iostreams, exit with the original's exit codes, and draw no window. Memory safety: own everything through values, standard containers, std::unique_ptr (std::shared_ptr only for ownership that's really shared) and RAII; no new/delete, malloc/free, owning raw pointers, C arrays, C strings, printf-style formatting, reinterpret_cast or const_cast; keep std::span and std::string_view only where they can't outlive what they view; check every index that comes from input (.at() or an explicit bounds check); return std::optional, std::expected or std::variant instead of null pointers, sentinel values or error codes. Build rules: cmake_minimum_required(VERSION 3.25); CMAKE_CXX_STANDARD 20 with CMAKE_CXX_STANDARD_REQUIRED ON and CMAKE_CXX_EXTENSIONS OFF; CMAKE_RUNTIME_OUTPUT_DIRECTORY (and each CMAKE_RUNTIME_OUTPUT_DIRECTORY_<CONFIG>) set to ${CMAKE_BINARY_DIR}/bin; on your own targets only, -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror (/W4 /WX /permissive- with MSVC) and the standard library's hardening (_GLIBCXX_ASSERTIONS and _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE); an option CRAFT_SANITIZE that adds -fsanitize=address,undefined. Get libraries with FetchContent at a pinned release tag. Tests, if you write any, are a separate executable whose name ends in _tests, registered with enable_testing() and add_test. Run `cmake -S . -B target` and `cmake --build target` from app/ until both succeed with no warnings."

[[stack]]
name = "C++ + Qt 6 (Widgets)"
asked_by = [" qt ", " qt6 ", " qt 6 ", " qtwidgets "]
steps = "Use modern, memory-safe C++20 with Qt 6 Widgets for the window and UI. Create a CMake project in app/ itself (app/CMakeLists.txt and app/src/, not a folder inside app/) with find_package(Qt6 REQUIRED COMPONENTS Widgets), qt_standard_project_setup() and qt_add_executable, with MACOSX_BUNDLE off so the program is a plain file. If CMake can't find Qt 6, stop and say so plainly (it comes from `brew install qt`, the Qt Online Installer, or the qt6-base-dev package) rather than switching stacks. Qt ownership: every QObject has a parent or a std::unique_ptr owner (widgets added to a layout belong to its widget), connect with pointer-to-member signals and a context object, and never let a lambda capture `this` or a widget it may outlive; use QPointer for a widget you don't own. For --screenshot, show the window, wait with QTimer::singleShot until it has drawn, save window.grab() as a PNG and quit. Memory safety: own everything through values, standard and Qt containers, std::unique_ptr and RAII; no new without a parent, delete, malloc/free, owning raw pointers, C arrays, C strings, printf-style formatting, reinterpret_cast or const_cast; check every index that comes from input; return std::optional, std::expected or std::variant instead of null pointers, sentinel values or error codes. Build rules: cmake_minimum_required(VERSION 3.25); CMAKE_CXX_STANDARD 20 with CMAKE_CXX_STANDARD_REQUIRED ON and CMAKE_CXX_EXTENSIONS OFF; CMAKE_RUNTIME_OUTPUT_DIRECTORY (and each CMAKE_RUNTIME_OUTPUT_DIRECTORY_<CONFIG>) set to ${CMAKE_BINARY_DIR}/bin; on your own targets only, -Wall -Wextra -Wpedantic -Wshadow -Werror (/W4 /WX /permissive- with MSVC) and the standard library's hardening (_GLIBCXX_ASSERTIONS and _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE); an option CRAFT_SANITIZE that adds -fsanitize=address,undefined. Tests, if you write any, are a separate executable whose name ends in _tests (Qt Test is fine), registered with enable_testing() and add_test. Run `cmake -S . -B target` and `cmake --build target` from app/ until both succeed with no warnings."

[[stack]]
name = "C++ + Dear ImGui (SDL3)"
asked_by = [" imgui ", " dear imgui "]
steps = "Use modern, memory-safe C++20 with Dear ImGui on SDL3 (its SDL_Renderer backend) for the window and UI, both fetched with FetchContent at pinned release tags (SDL built as a static library, the ImGui core and its SDL3 and SDLRenderer3 backend files compiled into a library target). Create a CMake project in app/ itself (app/CMakeLists.txt and app/src/, not a folder inside app/). Wrap every SDL handle (window, renderer, texture) in a std::unique_ptr with its destroy function as the deleter, and shut ImGui and SDL down through RAII guards, so nothing is freed twice or leaked on an early return. For --screenshot, render about 120 frames, read the renderer's pixels with SDL_RenderReadPixels, save them as a PNG (stb_image_write fetched the same way) and exit. Memory safety: own everything through values, standard containers, std::unique_ptr and RAII; no new/delete, malloc/free, owning raw pointers, C arrays, C strings, printf-style formatting, reinterpret_cast or const_cast in your own code; give ImGui text through std::string's c_str() only for the call; check every index that comes from input; return std::optional, std::expected or std::variant instead of null pointers, sentinel values or error codes. Build rules: cmake_minimum_required(VERSION 3.25); CMAKE_CXX_STANDARD 20 with CMAKE_CXX_STANDARD_REQUIRED ON and CMAKE_CXX_EXTENSIONS OFF; CMAKE_RUNTIME_OUTPUT_DIRECTORY (and each CMAKE_RUNTIME_OUTPUT_DIRECTORY_<CONFIG>) set to ${CMAKE_BINARY_DIR}/bin; on your own targets only, -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror (/W4 /WX /permissive- with MSVC) and the standard library's hardening (_GLIBCXX_ASSERTIONS and _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE); an option CRAFT_SANITIZE that adds -fsanitize=address,undefined. Tests, if you write any, are a separate executable whose name ends in _tests, registered with enable_testing() and add_test. Run `cmake -S . -B target` and `cmake --build target` from app/ until both succeed with no warnings."

[[stack]]
name = "C++ + raylib"
asked_by = [" raylib "]
steps = "Use modern, memory-safe C++20 with raylib (a small game library) fetched with FetchContent at a pinned release tag. Create a CMake project in app/ itself (app/CMakeLists.txt and app/src/, not a folder inside app/), keep assets procedural (shapes, colours) unless the person provides some, and give anything raylib loads (textures, sounds, fonts) an owner type that unloads it in its destructor and can be moved but not copied. Keep the game's rules in plain classes apart from drawing, so they can be tested and stepped without a window. Memory safety: own everything through values, standard containers, std::unique_ptr and RAII; no new/delete, malloc/free, owning raw pointers, C arrays, C strings, printf-style formatting, reinterpret_cast or const_cast in your own code; check every index that comes from input or the game's state (grid cells, inventories); return std::optional, std::expected or std::variant instead of null pointers, sentinel values or error codes. Build rules: cmake_minimum_required(VERSION 3.25); CMAKE_CXX_STANDARD 20 with CMAKE_CXX_STANDARD_REQUIRED ON and CMAKE_CXX_EXTENSIONS OFF; CMAKE_RUNTIME_OUTPUT_DIRECTORY (and each CMAKE_RUNTIME_OUTPUT_DIRECTORY_<CONFIG>) set to ${CMAKE_BINARY_DIR}/bin; on your own targets only, -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror (/W4 /WX /permissive- with MSVC) and the standard library's hardening (_GLIBCXX_ASSERTIONS and _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE); an option CRAFT_SANITIZE that adds -fsanitize=address,undefined. Tests, if you write any, are a separate executable whose name ends in _tests, registered with enable_testing() and add_test. Run `cmake -S . -B target` and `cmake --build target` from app/ until both succeed with no warnings."

