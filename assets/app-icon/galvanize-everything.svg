<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Galvanize Everything</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6fd6"/>
      <stop offset="1" stop-color="#0f3f8f"/>
    </linearGradient>
    <linearGradient id="zinc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfe6ee"/>
      <stop offset="1" stop-color="#aebccc"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="110"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <!-- Zinc spangle: faint crystal facets across the tile. -->
    <g fill="#ffffff" opacity="0.07">
      <path d="M0 0 L190 0 L120 150 L0 210 Z"/>
      <path d="M512 0 L512 230 L380 170 L330 0 Z"/>
      <path d="M0 330 L150 290 L230 512 L0 512 Z"/>
      <path d="M512 340 L512 512 L320 512 L400 360 Z"/>
    </g>
    <!-- The bolt, with a soft shadow beneath it. -->
    <path d="M296 70 L150 290 L246 290 L212 442 L364 210 L266 210 Z" fill="#06214d" opacity="0.35" transform="translate(10 14)"/>
    <path d="M296 70 L150 290 L246 290 L212 442 L364 210 L266 210 Z" fill="url(#zinc)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
