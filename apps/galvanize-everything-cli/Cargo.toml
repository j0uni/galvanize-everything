[package]
name = "galvanize-everything-cli"
description = "Galvanize Everything on the command line: every tool, the MCP server, setup and doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
galvanize-everything-engine = { workspace = true }
galvanize-everything-engines = { workspace = true }
galvanize-everything-evidence = { workspace = true }
galvanize-everything-platform = { workspace = true }
galvanize-everything-mcp = { workspace = true }
galvanize-everything-ai = { workspace = true }
galvanize-everything-setup = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }

[features]
wasm-plugins = ["galvanize-everything-engine/wasm-plugins"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# The DPI-aware manifest for galvanize-everything-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
